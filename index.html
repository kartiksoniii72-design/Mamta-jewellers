<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
    }

    #app {
      width: 100%;
      min-height: 100vh;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="app">

    <div class="screen">
      <div class="container">

        <h1>My Website</h1>

        <p>Welcome</p>

      </div>
    </div>

  </div>

</body>
</html>
<script>
  // Part 2 will be added here.
</script>

<style>
  .start-button {
    margin-top: 30px;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }

  .start-button:hover {
    background: #1d4ed8;
  }
</style>

<script>
  const startButton = document.createElement("button");

  startButton.className = "start-button";
  startButton.textContent = "START";

  document.querySelector(".container").appendChild(startButton);

  startButton.addEventListener("click", function () {
    alert("START button is working!");
  });
</script>
<style>
  /* ==============================
     PART 3 - MAIN MENU
  ============================== */

  .menu-screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .menu-container {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  .menu-container h2 {
    font-size: 32px;
    margin-bottom: 12px;
  }

  .menu-container p {
    color: #cbd5e1;
    font-size: 17px;
    margin-bottom: 30px;
  }

  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .menu-button {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }

  .menu-button:hover {
    background: #1d4ed8;
  }

  .menu-button.back {
    background: #374151;
  }

  .menu-button.back:hover {
    background: #4b5563;
  }
</style>

<div class="menu-screen" id="mainMenu">

  <div class="menu-container">

    <h2>Main Menu</h2>

    <p>Select an option to continue.</p>

    <div class="menu-buttons">

      <button class="menu-button" id="continueButton">
        CONTINUE
      </button>

      <button class="menu-button" id="optionsButton">
        OPTIONS
      </button>

      <button class="menu-button back" id="backButton">
        BACK
      </button>

    </div>

  </div>

</div>

<script>
  /* ==============================
     PART 3 - BUTTON CONNECTIONS
  ============================== */

  const part3StartButton = document.querySelector(".start-button");
  const mainMenu = document.getElementById("mainMenu");

  const continueButton = document.getElementById("continueButton");
  const optionsButton = document.getElementById("optionsButton");
  const backButton = document.getElementById("backButton");


  part3StartButton.addEventListener("click", function () {
    document.querySelector(".screen").style.display = "none";
    mainMenu.style.display = "flex";
  });


  continueButton.addEventListener("click", function () {
    alert("CONTINUE button is working!");
  });


  optionsButton.addEventListener("click", function () {
    alert("OPTIONS button is working!");
  });


  backButton.addEventListener("click", function () {
    mainMenu.style.display = "none";
    document.querySelector(".screen").style.display = "flex";
  });
</script>
<style>
  /* ==============================
     PART 4 - CONTENT SCREEN
  ============================== */

  .content-screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .content-container {
    width: 100%;
    max-width: 600px;
    text-align: center;
  }

  .content-container h2 {
    font-size: 32px;
    margin-bottom: 15px;
  }

  .content-card {
    background: #1f2937;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
  }

  .content-card p {
    color: #cbd5e1;
    font-size: 17px;
    line-height: 1.6;
  }

  .content-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .content-button {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }

  .content-button:hover {
    background: #1d4ed8;
  }

  .content-button.back {
    background: #374151;
  }

  .content-button.back:hover {
    background: #4b5563;
  }
</style>


<div class="content-screen" id="contentScreen">

  <div class="content-container">

    <h2>Welcome to the Main Feature</h2>

    <div class="content-card">
      <p>
        This is the main content area of the website.
        More features will be added here in the next parts.
      </p>
    </div>

    <div class="content-buttons">

      <button class="content-button" id="actionButton">
        START FEATURE
      </button>

      <button class="content-button back" id="contentBackButton">
        BACK
      </button>

    </div>

  </div>

</div>


<script>
  /* ==============================
     PART 4 - SCREEN CONNECTION
  ============================== */

  const contentScreen = document.getElementById("contentScreen");
  const actionButton = document.getElementById("actionButton");
  const contentBackButton = document.getElementById("contentBackButton");


  continueButton.addEventListener("click", function () {
    mainMenu.style.display = "none";
    contentScreen.style.display = "flex";
  });


  actionButton.addEventListener("click", function () {
    alert("Main feature is working!");
  });


  contentBackButton.addEventListener("click", function () {
    contentScreen.style.display = "none";
    mainMenu.style.display = "flex";
  });
</script>
<style>
  /* ==============================
     PART 5 - OPTIONS SCREEN
  ============================== */

  .options-screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .options-container {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  .options-container h2 {
    font-size: 32px;
    margin-bottom: 15px;
  }

  .option-box {
    background: #1f2937;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
  }

  .option-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #374151;
    font-size: 17px;
  }

  .option-row:last-child {
    border-bottom: none;
  }

  .option-button {
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    background: #2563eb;
    color: #ffffff;
    font-weight: bold;
    cursor: pointer;
  }

  .option-button:hover {
    background: #1d4ed8;
  }

  .options-back {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    background: #374151;
    color: #ffffff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }

  .options-back:hover {
    background: #4b5563;
  }
</style>


<div class="options-screen" id="optionsScreen">

  <div class="options-container">

    <h2>Options</h2>

    <div class="option-box">

      <div class="option-row">
        <span>Sound</span>
        <button class="option-button" id="soundButton">
          ON
        </button>
      </div>

      <div class="option-row">
        <span>Notifications</span>
        <button class="option-button" id="notificationButton">
          ON
        </button>
      </div>

    </div>

    <button class="options-back" id="optionsBackButton">
      BACK
    </button>

  </div>

</div>


<script>
  /* ==============================
     PART 5 - OPTIONS CONNECTION
  ============================== */

  const optionsScreen = document.getElementById("optionsScreen");
  const soundButton = document.getElementById("soundButton");
  const notificationButton = document.getElementById("notificationButton");
  const optionsBackButton = document.getElementById("optionsBackButton");


  optionsButton.addEventListener("click", function () {
    mainMenu.style.display = "none";
    optionsScreen.style.display = "flex";
  });


  soundButton.addEventListener("click", function () {
    if (soundButton.textContent.trim() === "ON") {
      soundButton.textContent = "OFF";
    } else {
      soundButton.textContent = "ON";
    }
  });


  notificationButton.addEventListener("click", function () {
    if (notificationButton.textContent.trim() === "ON") {
      notificationButton.textContent = "OFF";
    } else {
      notificationButton.textContent = "ON";
    }
  });


  optionsBackButton.addEventListener("click", function () {
    optionsScreen.style.display = "none";
    mainMenu.style.display = "flex";
  });
</script>
<style>
  /* ==============================
     PART 6 - ANIMATION & RESPONSIVE
  ============================== */

  .screen,
  .menu-screen,
  .content-screen,
  .options-screen {
    animation: screenFade 0.35s ease;
  }

  @keyframes screenFade {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  button {
    transition:
      background 0.2s ease,
      transform 0.15s ease,
      opacity 0.2s ease;
  }

  button:active {
    transform: scale(0.97);
  }


  /* ==============================
     MOBILE
  ============================== */

  @media (max-width: 600px) {

    .screen,
    .menu-screen,
    .content-screen,
    .options-screen {
      padding: 16px;
    }

    h1 {
      font-size: 32px;
    }

    .menu-container h2,
    .content-container h2,
    .options-container h2 {
      font-size: 27px;
    }

    .menu-container p,
    .content-card p {
      font-size: 16px;
    }

    .start-button,
    .menu-button,
    .content-button,
    .options-back {
      padding: 14px 18px;
      font-size: 16px;
    }

    .content-card,
    .option-box {
      padding: 20px;
    }

    .option-row {
      font-size: 16px;
    }
  }


  /* ==============================
     VERY SMALL SCREENS
  ============================== */

  @media (max-width: 360px) {

    h1 {
      font-size: 28px;
    }

    .menu-container h2,
    .content-container h2,
    .options-container h2 {
      font-size: 24px;
    }

    .option-row {
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
<script>
  /* ==============================
     PART 7 - FINAL FUNCTIONALITY
  ============================== */

  // Prevent accidental page reload from buttons
  document.querySelectorAll("button").forEach(function (button) {
    button.setAttribute("type", "button");
  });


  // Main feature status
  let featureStarted = false;


  actionButton.addEventListener("click", function () {

    featureStarted = !featureStarted;

    if (featureStarted) {
      actionButton.textContent = "FEATURE RUNNING";
      actionButton.style.background = "#16a34a";
    } else {
      actionButton.textContent = "START FEATURE";
      actionButton.style.background = "#2563eb";
    }

  });


  // Keep the current screen visible when using browser refresh
  // No data is saved yet; this will be completed in Part 8.

  console.log("Part 7 loaded successfully.");
</script>
<style>
  /* ==============================
     PART 8 - FINAL POLISH
  ============================== */

  body {
    overflow-x: hidden;
  }

  .container,
  .menu-container,
  .content-container,
  .options-container {
    animation: containerIn 0.45s ease;
  }

  @keyframes containerIn {
    from {
      opacity: 0;
      transform: scale(0.98);
    }

    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  button {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
</style>


<script>
  /* ==============================
     PART 8 - FINAL CHECK
  ============================== */

  // Make sure every button is safe to click.
  document.querySelectorAll("button").forEach(function (button) {
    button.setAttribute("type", "button");
  });


  // Final startup message.
  console.log("Website loaded successfully.");
  console.log("All 8 parts are connected.");


  // Small final safety check.
  window.addEventListener("load", function () {
    console.log("Website is ready.");
  });
</script>
