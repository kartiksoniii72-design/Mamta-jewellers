<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080705">
<title>Mamta Jewellers | Luxury Jewellery</title>

<style>
:root{
  --gold:#d7b45a;
  --gold2:#f2dc8c;
  --black:#090806;
  --card:#17140f;
  --line:#3b301c;
}

*{box-sizing:border-box;margin:0}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(circle at 10% 10%,#29200f,#090806 35%,#14100a);
  color:#fff;
  font-family:Georgia,serif;
}

button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.top{
  padding:7px;
  text-align:center;
  background:#050403;
  color:#bfb5a2;
  font:11px Arial;
  letter-spacing:2px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#080705ef;
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:13px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:auto;
}

.mark{
  width:43px;
  height:43px;
  border:1px solid var(--gold);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-size:23px;
  box-shadow:0 0 25px #d7b45a22;
}

.logo b{
  display:block;
  color:var(--gold2);
  font-size:18px;
  letter-spacing:1px;
}

.logo small{
  font:9px Arial;
  letter-spacing:3px;
  color:#aaa;
}

nav{
  display:flex;
  gap:20px;
  font:12px Arial;
  color:#ddd;
}

nav a:hover{color:var(--gold2)}

.btn,.outline{
  border-radius:9px;
  padding:11px 16px;
}

.btn{
  background:linear-gradient(135deg,#a77b22,#f2dc8c);
  color:#17120a;
  border:0;
  font-weight:bold;
}

.outline{
  background:transparent;
  color:#eee;
  border:1px solid var(--line);
}

.hero{
  min-height:570px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:60px 20px;
}

.heroin{
  max-width:850px;
  animation:up .8s ease;
}

.ey{
  font:11px Arial;
  letter-spacing:4px;
  color:var(--gold);
  margin-bottom:16px;
}

.hero h1{
  font-size:clamp(45px,8vw,82px);
  font-weight:400;
  line-height:.95;
}

.hero h1 span{
  color:var(--gold2);
  font-style:italic;
}

.hero p{
  max-width:650px;
  margin:22px auto 28px;
  font:15px Arial;
  color:#bcb3a5;
  line-height:1.8;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.stats{
  max-width:900px;
  margin:-20px auto 50px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  padding:20px;
  text-align:center;
  background:#ffffff08;
  border:1px solid var(--line);
  border-radius:14px;
}

.stat b{
  display:block;
  color:var(--gold2);
  font-size:21px;
}

.stat small{
  font:10px Arial;
  color:#999;
}

section{
  max-width:1200px;
  margin:auto;
  padding:70px 20px;
}

.head{
  text-align:center;
  margin-bottom:30px;
}

.head h2{
  font-size:40px;
  font-weight:400;
}

.head p{
  font:13px Arial;
  color:#999;
  margin-top:8px;
}

.rates{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f6f0e5;
  color:#17130d;
  border-radius:16px;
  overflow:hidden;
}

.rate{
  text-align:center;
  padding:22px;
  border-right:1px solid #ddd2bd;
}

.rate:last-child{border:0}

.rate small{
  display:block;
  font:10px Arial;
  letter-spacing:2px;
  color:#766c5b;
}

.rate strong{
  font-size:24px;
  color:#876414;
}

.tools{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.filters{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.filter{
  padding:9px 13px;
  border-radius:999px;
  background:#11100d;
  border:1px solid var(--line);
  color:#bbb;
}

.filter.active{
  background:var(--gold);
  color:#111;
}

.search{
  background:#11100d;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 13px;
  color:#fff;
  outline:none;
  min-width:230px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.card{
  background:linear-gradient(#191610,#0e0d0a);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 55px #0008;
  border-color:#8f6d2d;
}

.pic{
  height:285px;
  background:#201b11;
  position:relative;
  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.card:hover img{
  transform:scale(1.06);
}

.ph{
  height:100%;
  display:grid;
  place-items:center;
  background:radial-gradient(circle,#624a1d,#17130d 65%);
  font-size:48px;
  color:var(--gold2);
}

.tag{
  position:absolute;
  top:10px;
  left:10px;
  background:#080705dd;
  border:1px solid var(--line);
  padding:5px 8px;
  border-radius:99px;
  font:9px Arial;
  color:var(--gold2);
}

.body{padding:16px}

.body h3{
  font-size:18px;
  font-weight:400;
}

.meta{
  font:11px Arial;
  color:#999;
  line-height:1.7;
  margin-top:6px;
}

.cost{
  font-size:20px;
  color:var(--gold2);
  margin:10px 0;
}

.row{
  display:flex;
  gap:7px;
}

.row>*{flex:1}

.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

.about h2{
  font-size:43px;
  font-weight:400;
}

.about p{
  font:14px Arial;
  color:#aaa;
  line-height:1.9;
  margin-top:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.feature{
  padding:18px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#ffffff04;
}

.feature b{
  color:var(--gold2);
  display:block;
  margin-bottom:6px;
}

.feature span{
  font:11px Arial;
  color:#999;
}

footer{
  text-align:center;
  border-top:1px solid var(--line);
  background:#050403;
  padding:40px 20px;
}

.footlogo{
  justify-content:center;
  margin-bottom:12px;
}

.modal,.drawer{
  position:fixed;
  z-index:100;
}

.modal{
  inset:0;
  background:#000b;
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.open{display:flex}

.box{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:#15120d;
  border:1px solid var(--line);
  border-radius:17px;
  padding:23px;
}

.mtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.mtop h3{
  font-size:27px;
  font-weight:400;
  color:var(--gold2);
}

.x{
  background:none;
  border:0;
  color:#aaa;
  font-size:28px;
}

.form{
  display:grid;
  gap:9px;
}

.form label{
  font:10px Arial;
  color:#999;
}

.form input
